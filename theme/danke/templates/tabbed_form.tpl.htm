	<tmpl_if name="form_hint">
		<div class='page-header'>
			<h1><tmpl_var name="form_hint"></h1>
		</div>
	</tmpl_if>
	<tmpl_if name="msg">
		<div class='alert alert-notification' role='status'><tmpl_var name="msg"></div>
	</tmpl_if>
	<tmpl_if name="show_info_msg">
		<div class='alert alert-warning' role='status'><tmpl_var name="show_info_msg"></div>
	</tmpl_if>
	<tmpl_if name="error">
		<div class='alert alert-danger clear' role='alert'>
			<div class='alert-label'><strong>
					<tmpl_var name="error_txt">
				</strong></div>
			<div class='alert-content'>
				<ul style="list-style-type:none">
					<tmpl_var name="error">
				</ul>
			</div>
		</div>
	</tmpl_if>

	<!-- content in tabs -->
	<div class='content-tab-wrapper dk-card dk-tabcard'>
		<!-- tabs -->
		<div class='dk-tabs-scroller'>
		<ul class='nav nav-tabs' role='tablist'>
			<tmpl_loop name="formTab">
				<li role='presentation'<tmpl_if name="active"> class='active'</tmpl_if>>
					<a href='#' role='tab'<tmpl_if name="active"> aria-selected='true'<tmpl_else> aria-selected='false'</tmpl_if> onclick="return ISPConfig.changeTab('<tmpl_var name='name'>','<tmpl_var name='app_module'>/<tmpl_var name='form_action'>')">
						<tmpl_var name='title'>
					</a>
					</li>
			</tmpl_loop>
		</ul>
		</div>

		<div id="tabbox_content" class="tab-content" role='tabpanel'>
			<div class='tab-pane active fade in'>
				<tmpl_dyninclude name="content_tpl">
			</div>
		</div>

		<input type="hidden" name="_csrf_id" value="{tmpl_var name='_csrf_id'}" />
		<input type="hidden" name="_csrf_key" value="{tmpl_var name='_csrf_key'}" />
		<input type="hidden" name="next_tab" value="">
	</div>
